<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem('ig.theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b120d">
<title>Grove Chess</title>
<link rel="stylesheet" href="../../../engine/app.css">
<style>
  /* Deeper than the grove: the same forest, darker. */
  :root {
    --bg: #0b120d; --panel: #142019; --panel-2: #1a2a1f; --line: #26392c;
    --text: #edf2e6; --dim: #93a894; --accent: #a9d98b; --accent-ink: #13260e;
  }
  [hidden] { display: none !important; }
  .pix { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  .eyebrow { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin: 0 0 2px; }
  .tag { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
  #preview { width: 100%; max-width: 440px; margin: 4px auto; }
  .deepest { text-align: center; font-size: 15px; color: var(--dim); }
  /* The three ways to play Grove Chess, on every page of it. */
  .modes { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin: 14px 0 0; }
  .modes a { padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; color: var(--dim); text-decoration: none; font-size: 15px; }
  .modes a[aria-current] { color: var(--accent-ink); background: var(--accent); border-color: transparent; }
  .hud { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 0 0 6px; }
  .hud b { font-size: 20px; }
  .chipline { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  #board { width: 100%; max-width: 460px; margin: 0 auto; touch-action: manipulation; }
  #status { min-height: 26px; margin: 10px 0 2px; font-weight: 600; }
  #info { min-height: 44px; font-size: 15px; color: var(--dim); margin-bottom: 10px; }
  .fallnote { text-align: center; font-size: 22px; font-weight: 700; margin: 10px 0 0; }
  #fallcv { display: block; width: 100%; max-width: 420px; margin: 6px auto 0; border-radius: 14px; }
  .offering #fallcv { max-width: 280px; }
  /* The two pieces offered on the way down. */
  #offer { display: grid; gap: 10px; margin: 14px 0 0; }
  .offercard { display: grid; grid-template-columns: 76px 1fr; gap: 12px; align-items: start; width: 100%; min-height: 0;
    text-align: left; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 12px; cursor: pointer; }
  .offercard:active { border-color: var(--accent); }
  .offercard canvas.model { width: 60px; height: 72px; display: block; margin: 0 auto; image-rendering: pixelated; }
  .offercard canvas.diagram { width: 72px; height: 72px; margin-top: 6px; border-radius: 4px; }
  .offercard h3 { margin: 0 0 2px; font-size: 18px; }
  .offercard p { margin: 0 0 6px; font-size: 15px; }
  .rabbitrow { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 12px; }
  .rabbitcell { display: grid; justify-items: center; gap: 2px; padding: 6px 8px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
  .rabbitcell canvas { width: 45px; height: 54px; }
  dialog#sheet { width: min(560px, calc(100vw - 20px)); max-height: 86vh; padding: 0;
    background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 18px; }
  dialog#sheet::backdrop { background: rgba(4, 10, 6, .7); }
  .sheet-head { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center;
    gap: 10px; padding: 14px 16px; background: var(--bg); border-bottom: 1px solid var(--line); z-index: 1; }
  .sheet-head h2 { margin: 0; }
  .sheet-head button { width: auto; min-height: 44px; padding: 8px 16px; }
  #sheet-list { padding: 12px 16px 18px; display: grid; gap: 10px; }
  .prow { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: start;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
  .prow canvas.model { width: 96px; height: 112px; background: #e9e2c8; border-radius: 10px; }
  .prow canvas.diagram { width: 84px; height: 84px; margin-top: 8px; border-radius: 4px; }
  .prow h3 { margin: 0 0 2px; font-size: 18px; }
  .prow p { margin: 0 0 6px; font-size: 15px; }
  .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
  .chip { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px; font-size: 13px; width: auto; min-height: 44px; border-radius: 12px; }
  .chip canvas { width: 30px; height: 36px; }
  /* Autochess setup: the rabbits you have, and your line, left to right. */
  #tray { margin-bottom: 10px; }
  .chip small { color: var(--dim); font-size: 12px; }
  .slot { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; margin-bottom: 6px; }
  .slot[aria-current='true'] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .slot .who { display: flex; gap: 8px; align-items: center; width: auto; min-height: 44px; padding: 4px 10px 4px 4px; text-align: left; }
  .slot .who canvas { width: 30px; height: 36px; }
  .slot .what { font-size: 14px; }
  .slot .what b { display: block; font-size: 15px; }
  .slot .acts { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
  .slot .acts button { width: auto; min-height: 40px; padding: 6px 12px; font-size: 14px; border-radius: 10px; }
  .slot .acts button[aria-pressed='true'] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

  /* The runner: hand, rewards, scorecard, settings. */
  .handrow { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 10px 0; }
  .handcell { display: grid; justify-items: center; gap: 2px; padding: 6px 8px; min-width: 64px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); font-size: 12px; text-align: center; }
  .handcell canvas { width: 30px; height: 36px; }
  .handcell.picked { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
  .handcell button { all: unset; }
  .suit { font-weight: 800; }
  /* What carries between descents, and golf's courses. */
  .handrow button.handcell { font: inherit; color: var(--text); cursor: pointer; min-height: 0; width: auto; }
  .waystones { display: grid; gap: 6px; margin: 4px 0 12px; }
  .waystone { display: flex; gap: 10px; align-items: baseline; font-size: 14px; color: var(--dim); }
  .waystone .stone { font-size: 18px; color: var(--line); }
  .waystone.lit { color: var(--text); }
  .waystone.lit .stone { color: #5fd0d8; text-shadow: 0 0 8px #5fd0d8; }
  .courses { display: grid; gap: 6px; margin: 4px 0 12px; }
  .coursecard { display: grid; gap: 2px; text-align: left; width: 100%; min-height: 0; padding: 10px 12px; font: inherit; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
  .coursecard.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .coursecard:disabled { opacity: .5; }
  .card .row button { min-height: 44px; }
  table.score { width: 100%; border-collapse: collapse; font-size: 15px; margin: 8px 0 14px; }
  table.score th, table.score td { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: center; }
  table.score th:first-child, table.score td:first-child { text-align: left; }
  .lifeline { letter-spacing: .2em; color: #e0445a; }
  .modehead { text-align: center; }
  .records { text-align: center; font-size: 15px; color: var(--dim); margin: 8px 0; }
  /* Autochess setup: the rabbits you have, and your line, left to right. */
  #tray { margin-bottom: 10px; }
  .chip small { color: var(--dim); font-size: 12px; }
  .slot { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; margin-bottom: 6px; }
  .slot[aria-current='true'] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .slot .who { display: flex; gap: 8px; align-items: center; width: auto; min-height: 44px; padding: 4px 10px 4px 4px; text-align: left; }
  .slot .who canvas { width: 30px; height: 36px; }
  .slot .what { font-size: 14px; }
  .slot .what b { display: block; font-size: 15px; }
  .slot .acts { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
  .slot .acts button { width: auto; min-height: 40px; padding: 6px 12px; font-size: 14px; border-radius: 10px; }
  .slot .acts button[aria-pressed='true'] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="../">&larr; Grove Chess</a>
    <span class="pill" id="modepill">Grove Chess</span>
  </div>

  <section data-screen="title">
    <div class="modehead">
      <p class="eyebrow">Hikari Garden</p>
      <h1 id="modename"></h1>
      <p class="dim" id="modeblurb"></p>
    </div>
    <canvas id="preview" class="pix" aria-label="The first level, turning"></canvas>
    <p class="records" id="records"></p>
    <div id="courses" class="courses" hidden></div>
    <div class="handrow" id="titlehand"></div>
    <p class="small dim center" id="handnote" hidden></p>
    <div class="handrow" id="titlechoices" hidden></div>
    <div id="waystones" class="waystones" hidden></div>
    <div class="stack"><button class="primary" id="begin" disabled>Finding the first level…</button></div>
    <div class="row" style="margin-top:10px">
      <button class="quiet" id="opensettings">Settings</button>
      <button class="quiet" id="titlepieces">The pieces here</button>
    </div>
    <p class="small dim center" id="testnote" hidden></p>
    <nav class="modes" id="modes" aria-label="Ways to play"></nav>
  </section>

  <section data-screen="settings" hidden>
    <h2 id="settingstitle">Settings</h2>
    <p class="small dim">Everything this mode is made of. Changes are kept for this mode on this phone; the first level is found again with them.</p>
    <div id="form"></div>
    <div class="row" style="margin-top:12px">
      <button class="quiet" id="resetsettings">Back to the mode's own</button>
      <button class="primary" id="closesettings">Done</button>
    </div>
  </section>

  <section data-screen="play" hidden>
    <div class="hud">
      <span>Move <b id="movecount">0</b> <span class="dim" id="movemax"></span></span>
      <span class="pill" id="goalpill"></span>
    </div>
    <div class="chipline" id="chips"></div>
    <canvas id="board" class="pix" aria-label="The board"></canvas>
    <p id="status"></p>
    <p id="info"></p>
    <div id="setup" hidden>
      <p class="tag" style="margin:0">Autochess</p>
      <p class="small dim" style="margin:2px 0 10px">Put a rabbit in each piece, then let them go.</p>
      <div class="chips" id="tray"></div>
      <div id="slots"></div>
      <div class="stack" style="margin-top:10px"><button class="primary" id="go">Let them go</button></div>
      <div class="row" style="margin-top:10px">
        <button class="quiet" id="clearsetup">Take the rabbits out</button>
        <button class="quiet" id="setuppieces">Pieces</button>
      </div>
    </div>
    <div id="controls">
      <div class="row">
        <button class="quiet" id="wait">Wait a turn</button>
        <button class="quiet" id="pieces">Pieces</button>
      </div>
    </div>
    <div class="handrow" id="playhand"></div>
  </section>

  <section data-screen="between" hidden>
    <canvas id="fallcv" class="pix" width="240" height="300" aria-label="Your pieces, falling to the next level"></canvas>
    <p class="fallnote" id="betweennote"></p>
    <p class="center dim small" id="betweensub"></p>
    <div id="offer" hidden></div>
    <div id="pickbox" hidden>
      <p class="center" id="picktext"></p>
      <div class="handrow" id="pickhand"></div>
      <div class="stack"><button class="primary" id="pickdone" disabled>That one</button></div>
    </div>
    <div class="stack" id="betweennext" hidden style="margin-top:14px"><button class="primary" id="nextlevel">Next</button></div>
  </section>

  <section data-screen="over" hidden>
    <p class="eyebrow center" id="overeyebrow"></p>
    <p class="big center" id="overbig"></p>
    <p class="center dim" id="overwhy"></p>
    <div id="overbody"></div>
    <div class="stack">
      <button class="primary" id="again">Again</button>
      <button class="quiet" id="oversettings">Settings</button>
    </div>
  </section>
</div>

<dialog id="sheet">
  <div class="sheet-head">
    <h2>The pieces</h2>
    <button class="quiet" id="sheet-close">Close</button>
  </div>
  <div id="sheet-list"></div>
</dialog>

<script type="module" src="main.js"></script>
</body>
</html>
